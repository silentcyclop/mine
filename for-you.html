<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap');

  :root {
    --rose: #C98A9C;
    --rose-deep: #8E5A6B;
    --cream: #FBF4EE;
    --plum: #4A3040;
    --gold: #C9A66B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: linear-gradient(180deg, #4A3040 0%, #6B4257 50%, #8E5A6B 100%);
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ambient floating particles */
  .particle {
    position: absolute;
    bottom: -10%;
    border-radius: 50%;
    background: rgba(251, 244, 238, 0.35);
    animation: float linear infinite;
    pointer-events: none;
  }

  @keyframes float {
    to { transform: translateY(-115vh) translateX(var(--drift, 20px)); opacity: 0; }
  }

  /* ---------- gate (tap to open) ---------- */
  #gate {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    z-index: 10;
    cursor: pointer;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }

  #gate.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .envelope {
    width: 92px;
    height: 64px;
    position: relative;
  }

  .envelope-body {
    position: absolute;
    inset: 0;
    background: var(--cream);
    border-radius: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }

  .envelope-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0;
    border-left: 46px solid transparent;
    border-right: 46px solid transparent;
    border-top: 34px solid var(--rose);
    transform-origin: top;
    transition: transform 0.5s ease;
  }

  #gate:active .envelope-flap { transform: rotateX(-160deg); }

  .tap-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--cream);
    letter-spacing: 0.5px;
    opacity: 0.9;
  }

  .tap-sub {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(251, 244, 238, 0.55);
  }

  /* ---------- revealed content ---------- */
  #content {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 40px 32px;
    max-width: 420px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.1s ease 0.3s, transform 1.1s ease 0.3s;
  }

  #content.show {
    opacity: 1;
    transform: translateY(0);
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
  }

  .message {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.5;
    color: var(--cream);
  }

  .message em {
    color: var(--gold);
    font-style: italic;
  }

  .signature {
    margin-top: 28px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: rgba(251, 244, 238, 0.7);
  }

  #content { cursor: pointer; }

  .message {
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 26px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(251, 244, 238, 0.25);
    transition: background 0.3s ease, transform 0.3s ease;
  }

  .dot.active {
    background: var(--gold);
    transform: scale(1.3);
  }

  .swipe-hint {
    margin-top: 20px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(251, 244, 238, 0.3);
  }

  .note {
    position: fixed;
    bottom: 18px;
    left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(251, 244, 238, 0.35);
    z-index: 5;
  }
</style>
</head>
<body>

  <div id="gate">
    <div class="envelope">
      <div class="envelope-flap"></div>
      <div class="envelope-body"></div>
    </div>
    <div class="tap-text">tap to open</div>
    <div class="tap-sub">a little something for you</div>
  </div>

  <div id="content">
    <div class="eyebrow">for you</div>
    <div class="message" id="message-text"></div>
    <div class="signature">— always, me</div>
    <div class="dots" id="dots"></div>
    <div class="swipe-hint">tap to continue →</div>
  </div>

  <div class="note">🎵 turn your volume up</div>

  <!-- Hidden YouTube player: plays audio only, video is visually hidden -->
  <div id="yt-player" style="position:fixed; top:-9999px; left:-9999px; width:1px; height:1px;"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // ====== EDIT HERE: your messages, one per slide ======
    const MESSAGES = [
      "Just wanted to remind you — you make my days so much better 💛",
      "Random thought: I'm really lucky to have you.",
      "You know that feeling when your favorite song comes on? That's you, honestly.",
      "Thank you for putting up with me lol. I appreciate you more than I say.",
      "Hope this made you smile. I love you 🫶"
    ];

    // ====== EDIT HERE: add as many YouTube video links/IDs as you want ======
    // Get the ID from the URL after youtu.be/ or ?v=
    const SONGS = [
      'xnQbCpY1a2g', // Chai Ya Saa Kumi - Ywaya Tajiri
      'a5DVvRztj7Y',
      '9SM0GM0hTW8',
      'pRfmrE0ToTo',
      'cKdkkzNBE2g'
      // 'ANOTHER_VIDEO_ID',
    ];

    const gate = document.getElementById('gate');
    const content = document.getElementById('content');
    const messageEl = document.getElementById('message-text');
    const dotsEl = document.getElementById('dots');
    let player;
    let playerReady = false;
    let slideIndex = 0;

    // build dots
    MESSAGES.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      dotsEl.appendChild(d);
    });

    function showSlide(i) {
      messageEl.style.opacity = 0;
      setTimeout(() => {
        messageEl.innerHTML = MESSAGES[i];
        messageEl.style.opacity = 1;
        [...dotsEl.children].forEach((d, idx) => d.classList.toggle('active', idx === i));
      }, 250);
    }
    messageEl.style.transition = 'opacity 0.25s ease';
    showSlide(0);

    content.addEventListener('click', () => {
      slideIndex = (slideIndex + 1) % MESSAGES.length;
      showSlide(slideIndex);
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '1',
        width: '1',
        videoId: SONGS[0],
        playerVars: {
          autoplay: 0,
          controls: 0,
          loop: 1,
          // when there's more than one song, loop the whole playlist;
          // with one song, loop just that song
          playlist: SONGS.length > 1 ? SONGS.slice(1).join(',') : SONGS[0],
          playsinline: 1
        },
        events: {
          onReady: () => { playerReady = true; }
        }
      });
    }

    gate.addEventListener('click', () => {
      if (playerReady) {
        player.playVideo();
      }
      gate.classList.add('hidden');
      content.classList.add('show');
      spawnParticles();
    }, { once: true });

    function spawnParticles() {
      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          const p = document.createElement('div');
          p.className = 'particle';
          const size = 4 + Math.random() * 6;
          p.style.width = size + 'px';
          p.style.height = size + 'px';
          p.style.left = Math.random() * 100 + 'vw';
          p.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
          p.style.animationDuration = (6 + Math.random() * 6) + 's';
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 13000);
        }, i * 400);
      }
      setInterval(() => {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 4 + Math.random() * 6;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
        p.style.animationDuration = (6 + Math.random() * 6) + 's';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 13000);
      }, 2500);
    }
  </script>

</body>
</html>
